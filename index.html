<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記記帳</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 Chart.js 來繪製圓餅圖 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- 手機桌面 App 專屬圖示 -->
    <link rel="apple-touch-icon" href="icon.jpg?v=6">
    <link rel="icon" type="image/jpeg" href="icon.jpg?v=6">
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen pb-10">

    <!-- 頂部導航 -->
    <div class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-xl font-bold">📱 記記帳</h1>
        <button id="feedback-open-btn" class="bg-blue-500 hover:bg-blue-400 text-white px-3 py-1 rounded-full text-xs font-bold shadow transition">💡 系統回報</button>
    </div>

    <!-- 主要內容區 -->
    <div id="app-content" class="max-w-6xl mx-auto mt-4 px-4 grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- 左側：新增表單 -->
        <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-100 h-fit">
            <h2 class="text-xl font-bold mb-4 border-b pb-2 text-blue-600">✍️ 新增紀錄</h2>
            <form id="expense-form" class="space-y-4">
                
                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-1">📅 日期</label>
                    <input type="date" id="expense-date" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-400 bg-gray-50 text-gray-700 font-bold">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-1">分類</label>
                    <select id="category" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-400 bg-gray-50">
                        <option value="早餐">🥐 早餐</option>
                        <option value="午餐">🍱 午餐</option>
                        <option value="晚餐">🍽️ 晚餐</option>
                        <option value="飲料">🧋 飲料/點心</option>
                        <option value="交通">🚌 交通</option>
                        <option value="購物">🛒 購物</option>
                        <option value="其他">✨ 其他</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-1">金額 (元)</label>
                    <input type="number" id="amount" required class="w-full border rounded-lg p-2 text-xl font-bold text-red-500 focus:ring-2 focus:ring-blue-400 bg-gray-50" placeholder="0">
                </div>

                <div class="flex items-center space-x-2 bg-blue-50 p-3 rounded-lg border border-blue-100">
                    <input type="checkbox" id="is-food" class="w-5 h-5 text-blue-600 rounded">
                    <label for="is-food" class="font-bold text-blue-800">🥗 這是一份餐點 (啟用 AI 分析)</label>
                </div>

                <div id="food-fields" class="hidden space-y-4 p-4 border-2 border-blue-200 rounded-lg bg-blue-50/50">
                    <div>
                        <label class="block text-sm font-bold text-gray-600 mb-1">食物名稱</label>
                        <input type="text" id="food-name" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-400" placeholder="例如：鮪魚蛋餅、雞腿便當">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-bold text-gray-600 mb-1">上傳照片 (自動極致壓縮)</label>
                        <input type="file" id="photo-upload" accept="image/*" class="w-full text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-100 file:text-blue-700 hover:file:bg-blue-200">
                        <img id="photo-preview" src="" class="mt-2 hidden w-32 h-32 object-cover rounded-lg border shadow-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-1">備註 (選填)</label>
                    <input type="text" id="note" class="w-full border rounded-lg p-2 bg-gray-50" placeholder="隨手記點什麼...">
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg shadow-lg hover:bg-blue-700 transition duration-200 active:scale-95 text-lg">
                    儲存紀錄 💾
                </button>
            </form>
        </div>

        <!-- 右側：本機紀錄列表與圓餅圖統計 -->
        <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-100 flex flex-col h-[750px]">
            <!-- 月份選擇器 -->
            <div class="flex justify-between items-center border-b pb-4 mb-4">
                <h2 class="text-xl font-bold text-blue-600">📊 歷史與統計</h2>
                <input type="month" id="filter-month" class="border-2 border-blue-200 rounded-lg p-1 text-sm font-bold text-gray-700 bg-white focus:ring-2 focus:ring-blue-400">
            </div>

            <!-- 月總額與分類圓餅圖區塊 -->
            <div class="bg-gradient-to-r from-blue-50 to-blue-100 rounded-xl p-4 mb-4 border border-blue-200 shadow-sm flex flex-col md:flex-row items-center justify-between">
                <div class="text-center md:text-left md:w-1/3 mb-4 md:mb-0">
                    <p class="text-sm text-blue-800 font-bold mb-1">該月總花費</p>
                    <p class="text-4xl font-extrabold text-red-500 tracking-wider" id="monthly-total">$0</p>
                </div>
                <!-- 圓餅圖容器 -->
                <div class="w-full md:w-2/3 h-40 relative flex justify-center">
                    <canvas id="category-chart"></canvas>
                </div>
            </div>

            <div class="flex justify-between items-center border-b pb-2 mb-3 mt-2">
                <h3 class="text-md font-bold text-gray-600">📃 紀錄明細</h3>
                <span class="text-xs bg-gray-100 text-gray-500 px-2 py-1 rounded-full">點擊垃圾桶可刪除</span>
            </div>

            <!-- 紀錄明細列表 -->
            <div id="expense-list" class="space-y-3 overflow-y-auto pr-2 flex-grow">
                <p class="text-center text-gray-400 mt-10">載入中或該月無紀錄...</p>
            </div>
        </div>
    </div>

    <!-- 💡 系統回報彈跳視窗 -->
    <div id="feedback-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl border border-gray-100">
            <h3 class="text-xl font-bold text-blue-600 mb-2">💡 系統回報與建議</h3>
            <p class="text-xs text-gray-500 mb-4">您可以回報 Bug、修正 AI 營養數據，或許願新功能！</p>
            <textarea id="feedback-input" rows="4" class="w-full border rounded-xl p-3 mb-4 bg-gray-50 focus:ring-2 focus:ring-blue-400 text-sm" placeholder="請在此輸入您的建議或問題..."></textarea>
            <div class="space-y-2">
                <button id="feedback-local-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl shadow transition text-sm">💾 存入本機備忘</button>
                <button id="feedback-email-btn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-xl shadow transition text-sm">📧 透過 Email 寄出</button>
                <button id="feedback-close-btn" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-2 rounded-xl transition text-sm">取消</button>
            </div>
        </div>
    </div>

    <script>
        // --- 初始化日期與圖表 ---
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        document.getElementById('expense-date').value = `${yyyy}-${mm}-${dd}`;
        document.getElementById('filter-month').value = `${yyyy}-${mm}`;
        
        let expenseChart = null; // 宣告圖表變數

        window.onload = () => loadDataFromLocal();
        document.getElementById('filter-month').addEventListener('change', () => loadDataFromLocal());

        // --- 系統回報視窗 ---
        const feedbackModal = document.getElementById('feedback-modal');
        document.getElementById('feedback-open-btn').onclick = () => feedbackModal.classList.remove('hidden');
        document.getElementById('feedback-close-btn').onclick = () => feedbackModal.classList.add('hidden');

        document.getElementById('feedback-local-btn').onclick = () => {
            const text = document.getElementById('feedback-input').value.trim();
            if (!text) { alert("請先輸入回報內容！"); return; }
            let feedbacks = JSON.parse(localStorage.getItem('my_feedbacks')) || [];
            feedbacks.push({ content: text, dateStr: `${yyyy}-${mm}-${dd}` });
            localStorage.setItem('my_feedbacks', JSON.stringify(feedbacks));
            alert("✅ 回報已成功存入手機記憶體！");
            document.getElementById('feedback-input').value = '';
            feedbackModal.classList.add('hidden');
        };

        document.getElementById('feedback-email-btn').onclick = () => {
            const text = document.getElementById('feedback-input').value.trim();
            if (!text) { alert("請先輸入回報內容！"); return; }
            const subject = encodeURIComponent("【記帳App系統回報與建議】");
            const body = encodeURIComponent(`回報內容：\n${text}`);
            window.location.href = `mailto:randyliu492@gmail.com?subject=${subject}&body=${body}`;
            feedbackModal.classList.add('hidden');
        };

        // --- 介面互動：食物選項 ---
        const isFoodCheck = document.getElementById('is-food');
        const foodFields = document.getElementById('food-fields');
        isFoodCheck.addEventListener('change', () => {
            if(isFoodCheck.checked) {
                foodFields.classList.remove('hidden');
                document.getElementById('food-name').required = true;
            } else {
                foodFields.classList.add('hidden');
                document.getElementById('food-name').required = false;
            }
        });

        // --- 圖片極致壓縮 ---
        let currentPhotoBase64 = null;
        document.getElementById('photo-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 150; 
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    currentPhotoBase64 = canvas.toDataURL('image/jpeg', 0.4); 
                    const preview = document.getElementById('photo-preview');
                    preview.src = currentPhotoBase64;
                    preview.classList.remove('hidden');
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        function simulateAI(foodName) {
            return {
                calories: Math.floor(Math.random() * 400 + 100),
                protein: Math.floor(Math.random() * 20 + 5)
            };
        }

        // --- 刪除功能 (全球通用函數) ---
        window.deleteExpense = function(id) {
            if (confirm("⚠️ 確定要刪除這筆紀錄嗎？刪除後無法恢復喔！")) {
                let expenses = JSON.parse(localStorage.getItem('my_expenses')) || [];
                // 過濾掉被點擊刪除的那一筆
                expenses = expenses.filter(item => item.id !== id);
                localStorage.setItem('my_expenses', JSON.stringify(expenses));
                // 重新載入畫面
                loadDataFromLocal();
            }
        };

        // --- 提交表單 ---
        document.getElementById('expense-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const isFood = isFoodCheck.checked;
            const foodName = document.getElementById('food-name').value;
            const selectedDateStr = document.getElementById('expense-date').value; 
            const monthStr = selectedDateStr.substring(0, 7);

            let newExpense = {
                id: Date.now().toString(), // 產生專屬 ID，方便刪除
                category: document.getElementById('category').value,
                amount: parseInt(document.getElementById('amount').value),
                note: document.getElementById('note').value,
                timestamp: Date.now(),
                dateStr: selectedDateStr, 
                monthStr: monthStr,
                isFood: isFood
            };

            if (isFood && foodName) {
                newExpense.foodName = foodName;
                newExpense.nutrition = simulateAI(foodName);
                if (currentPhotoBase64) newExpense.photoBase64 = currentPhotoBase64;
            }

            let expenses = JSON.parse(localStorage.getItem('my_expenses')) || [];
            expenses.push(newExpense);
            localStorage.setItem('my_expenses', JSON.stringify(expenses));

            this.reset();
            document.getElementById('expense-date').value = `${yyyy}-${mm}-${dd}`;
            foodFields.classList.add('hidden');
            document.getElementById('photo-preview').classList.add('hidden');
            currentPhotoBase64 = null;
            
            loadDataFromLocal();
        });

        // --- 繪製圓餅圖函數 ---
        function renderChart(categoryData) {
            const ctx = document.getElementById('category-chart').getContext('2d');
            
            // 如果原本已經有圖表，先銷毀它，不然會疊在一起
            if (expenseChart) {
                expenseChart.destroy();
            }

            // 取得分類名稱跟對應金額
            const labels = Object.keys(categoryData);
            const data = Object.values(categoryData);

            // 如果該月沒有花費，就畫一個灰色的空圖表
            if (data.length === 0) {
                expenseChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: { labels: ['無紀錄'], datasets: [{ data: [1], backgroundColor: ['#E5E7EB'] }] },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { tooltip: { enabled: false } } }
                });
                return;
            }

            // 正式繪製分類圓餅圖
            expenseChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        // 搭配我們分類的粉嫩色系
                        backgroundColor: ['#FCA5A5', '#FCD34D', '#86EFAC', '#93C5FD', '#C4B5FD', '#F9A8D4', '#FCA5A5'],
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right', labels: { boxWidth: 12, font: { size: 12 } } }
                    }
                }
            });
        }

        // --- 讀取與計算資料 ---
        function loadDataFromLocal() {
            const targetMonth = document.getElementById('filter-month').value; 
            const list = document.getElementById('expense-list');
            list.innerHTML = '';
            let totalAmount = 0;
            
            // 用來統計每個分類的總額
            let categoryTotals = {};

            let allExpenses = JSON.parse(localStorage.getItem('my_expenses')) || [];
            let monthExpenses = allExpenses.filter(item => item.monthStr === targetMonth);

            if(monthExpenses.length === 0) {
                list.innerHTML = '<p class="text-center text-gray-400 mt-10">這個月還沒有紀錄喔，開始記帳吧！</p>';
                document.getElementById('monthly-total').innerText = '$0';
                renderChart({}); // 畫出空圖表
                return;
            }

            monthExpenses.sort((a, b) => {
                if (b.dateStr !== a.dateStr) return b.dateStr.localeCompare(a.dateStr);
                return b.timestamp - a.timestamp;
            });

            monthExpenses.forEach(data => {
                totalAmount += data.amount; 
                
                // 將金額加進對應的分類裡
                categoryTotals[data.category] = (categoryTotals[data.category] || 0) + data.amount;
                
                let foodHtml = '';
                if (data.isFood) {
                    let imgHtml = data.photoBase64 ? `<img src="${data.photoBase64}" class="w-12 h-12 rounded object-cover ml-2">` : '';
                    foodHtml = `
                      <div class="mt-2 bg-blue-50 rounded p-2 text-sm text-blue-800 flex justify-between items-center border border-blue-100">
                          <div>
                              <span class="font-bold">🤖 AI 分析 (${data.foodName})：</span>
                              熱量 ${data.nutrition?.calories || 0} 大卡 / 蛋白質 ${data.nutrition?.protein || 0}g
                          </div>
                          ${imgHtml}
                      </div>
                    `;
                }

                // 加入垃圾桶刪除按鈕
                list.innerHTML += `
                    <div class="p-4 border rounded-lg hover:shadow-md transition bg-white shadow-sm">
                        <div class="flex justify-between items-start mb-1">
                            <div class="flex items-center space-x-2">
                                <span class="bg-gray-100 text-gray-700 px-2 py-1 rounded text-sm font-bold shadow-sm">${data.category}</span>
                                <span class="text-gray-500 font-medium text-sm tracking-wide">${data.dateStr}</span>
                            </div>
                            <div class="flex items-center space-x-4">
                                <span class="text-red-500 font-bold text-lg">$${data.amount}</span>
                                <button onclick="deleteExpense('${data.id}')" class="text-gray-300 hover:text-red-500 transition text-lg" title="刪除此筆紀錄">🗑️</button>
                            </div>
                        </div>
                        ${data.note ? `<p class="text-gray-600 text-sm mt-2 ml-1">📝 ${data.note}</p>` : ''}
                        ${foodHtml}
                    </div>
                `;
            });

            document.getElementById('monthly-total').innerText = '$' + totalAmount.toLocaleString();
            
            // 根據剛剛統計的數據畫出圖表
            renderChart(categoryTotals);
        }
    </script>
</body>
</html>
